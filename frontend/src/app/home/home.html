<div class="grid">
  @for (book of books; track book.id) {
    <div class="book-card">
      <div class="image-container">
        <img [src]="imageBaseUrl + book.image" [alt]="book.title" [routerLink]="['/book', book.id]" style="cursor: pointer;">
      </div>
      <div class="card-content">
        <h3>{{ book.title }}</h3>
        <p class="description">{{ book.description }}</p>
        <div class="card-footer">
          <span class="price">{{ book.price }} UAH</span>
          <button class="btn-buy" [routerLink]="['/book', book.id]">Details</button>
        </div>
      </div>
    </div>
  }
</div>

@if (books.length === 0 && !errorMessage) {
  <div class="empty-state">
    <p>No books available at the moment.</p>
  </div>
}
