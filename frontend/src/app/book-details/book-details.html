<div class="details-container" *ngIf="book">
  <div class="details-card">
    <div class="image-section">
      <img [src]="imageBaseUrl + book.image" [alt]="book.title">
    </div>
    <div class="info-section">
      <h1>{{ book.title }}</h1>
      <p class="price-tag">{{ book.price }} UAH</p>
      <div class="description-box">
        <h3>Description</h3>
        <p>{{ book.description }}</p>
      </div>
      <button class="btn-back" routerLink="/">Back to Catalog</button>
    </div>
  </div>
</div>
