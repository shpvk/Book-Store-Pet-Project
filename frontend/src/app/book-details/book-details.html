<p class="error-message" *ngIf="errorMessage()">
  {{ errorMessage() }}
</p>

<div class="details-container" *ngIf="book() as selectedBook">
  <div class="details-card">
    <div class="image-section">
      <img [src]="getBookImage(selectedBook.image)" [alt]="selectedBook.title + ' cover'">
    </div>
    <div class="info-section">
      <h1>{{ selectedBook.title }}</h1>
      <p class="price-tag">{{ selectedBook.price }} UAH</p>
      <div class="description-box">
        <h3>Description</h3>
        <p>{{ selectedBook.description }}</p>
      </div>
      <button type="button" class="btn-back" routerLink="/">Back to Catalog</button>
    </div>
  </div>
</div>
